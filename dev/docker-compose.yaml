x-app-env: &app-env
  HOST: 0.0.0.0
  PORT: 8082
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_USERNAME: elastic
  ELASTICSEARCH_PASSWORD: password
  KAFKA_BROKERS: kafka:29092
  KAFKA_TOPIC_ACCESS_LOGS: access-logs-ingest
  KAFKA_CLIENT_ID: homework-elastic
  KAFKA_GROUP_ID: access-logs-ingest-workers

services:
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.6.1
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      test:
        ipv4_address: 172.30.1.3

  kibana:
    container_name: kibana
    image: kibana:8.6.1
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      test:
        ipv4_address: 172.30.1.4

  kafka:
    container_name: kafka
    image: apache/kafka:latest
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      test:
        ipv4_address: 172.30.1.5

  api:
    container_name: api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    command:
      [
        "node_modules/.bin/ts-node-dev",
        "-r",
        "dotenv/config",
        "-r",
        "tsconfig-paths/register",
        "--respawn",
        "services/api/server.ts",
      ]
    environment:
      <<: *app-env
      ASSETS_DIR: /assets
    volumes:
      - ./src:/app
      - ../assets:/assets:ro
      - app_node_modules:/app/node_modules
    ports:
      - "8082:8082"
    user: "1000:1000"
    depends_on:
      - elasticsearch
      - kafka
    networks:
      test:
        ipv4_address: 172.30.1.2

  worker:
    container_name: worker
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    command:
      [
        "node_modules/.bin/ts-node-dev",
        "-r",
        "dotenv/config",
        "-r",
        "tsconfig-paths/register",
        "--respawn",
        "services/worker/worker.ts",
      ]
    environment:
      <<: *app-env
    volumes:
      - ./src:/app
      - app_node_modules:/app/node_modules
    user: "1000:1000"
    depends_on:
      - elasticsearch
      - kafka
    networks:
      test:
        ipv4_address: 172.30.1.6

volumes:
  es_data:
  app_node_modules:

networks:
  test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
